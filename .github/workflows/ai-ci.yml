name: ai CI
on:
  push:
    paths: ['ai-service/**', '.github/workflows/ai-ci.yml']
  pull_request:
    paths: ['ai-service/**', '.github/workflows/ai-ci.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: python -m pip install -r requirements-dev.txt
    - run: python -m compileall app
    - run: python -c "from app.main import app; assert app.title == 'Auction AI Service'"
