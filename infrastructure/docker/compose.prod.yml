services:
  frontend:
    build:
      context: ../../frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
  backend:
    build:
      context: ../../backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
  ai-service:
    build:
      context: ../../ai-service
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    restart: unless-stopped
